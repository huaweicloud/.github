name: Monthly Governance Audit
on:
  schedule:
    - cron: '0 3 1 * *'  # 每月1日 CST 11:00
  workflow_dispatch:

permissions:
  issues: write
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Checkout .github org repo (for templates)
        uses: actions/checkout@v4
        with:
          repository: ${{ github.repository_owner }}/.github
          path: .github-repo
          ref: main
          token: ${{ secrets.BOT_TOKEN }}

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install requests

      - name: Run Governance Audit (health report)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          #!/bin/bash
          echo "# huaweicloud 组织治理月度巡检报告"
          echo ""
          echo "> 日期: $(date +%Y-%m-%d)"
          echo "> 组织: huaweicloud"
          echo ""

          ORG="huaweicloud"
          TOTAL=0
          NO_LICENSE=0
          ISSUES_OFF=0
          NONSTD_BRANCH=0
          ARCHIVED=0

          PAGE=1
          while true; do
            DATA=$(curl -s -H "Authorization: token $GITHUB_TOKEN" \
              "https://api.github.com/orgs/$ORG/repos?type=all&per_page=100&page=$PAGE")
            COUNT=$(echo "$DATA" | jq 'length')
            if [ "$COUNT" -eq 0 ]; then break; fi
            TOTAL=$((TOTAL + COUNT))
            NO_LICENSE=$((NO_LICENSE + $(echo "$DATA" | jq '[.[] | select(.archived==false and .license==null)] | length')))
            ISSUES_OFF=$((ISSUES_OFF + $(echo "$DATA" | jq '[.[] | select(.archived==false and .has_issues==false)] | length')))
            NONSTD_BRANCH=$((NONSTD_BRANCH + $(echo "$DATA" | jq '[.[] | select(.archived==false and .default_branch!="main" and .default_branch!="master")] | .[].full_name' -r | wc -l)))
            ARCHIVED=$((ARCHIVED + $(echo "$DATA" | jq '[.[] | select(.archived==true)] | length')))
            PAGE=$((PAGE + 1))
          done

          ACTIVE=$((TOTAL - ARCHIVED))

          echo "| 指标 | 当前值 | 目标 | 状态 |"
          echo "|------|--------|------|------|"
          echo "| 活跃仓库 | $ACTIVE | — | ✅ |"
          echo "| 无License | $NO_LICENSE | 0 | $([ $NO_LICENSE -eq 0 ] && echo '✅' || echo '❌') |"
          echo "| Issues禁用 | $ISSUES_OFF | 0 | $([ $ISSUES_OFF -eq 0 ] && echo '✅' || echo '❌') |"
          echo "| 非标准分支 | $NONSTD_BRANCH | 0 | $([ $NONSTD_BRANCH -eq 0 ] && echo '✅' || echo '❌') |"
          echo ""

          echo "---"
          echo "*下次巡检: $(date -d '+1 month' +%Y-%m-%d) | 自动生成 by Hermes Agent*"
        shell: bash

      - name: Run Governance Upgrade (auto-fill L2/L3 configs)
        if: false  # 暂不自动执行（避免批量改存量仓库）；手动启用时改为 true
        env:
          GITHUB_TOKEN: ${{ secrets.BOT_TOKEN }}
          GITHUB_ORG: "huaweicloud"
          TEMPLATE_DIR: ".github-repo"
        run: python .github/scripts/governance_upgrade.py

      - name: Notify Upgrades (Feishu/Email/GitHub Issue)
        if: false  # 随升级步骤一起禁用
        env:
          # 飞书（可选）
          FEISHU_APP_ID: ${{ secrets.FEISHU_APP_ID }}
          FEISHU_APP_SECRET: ${{ secrets.FEISHU_APP_SECRET }}
          FEISHU_ADMIN_OPEN_ID: ${{ secrets.FEISHU_ADMIN_OPEN_ID }}
          FEISHU_ENABLED: "1"
          # 邮件
          EMAIL_ENABLED: "1"
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          EMAIL_REPORT_TO: ${{ secrets.EMAIL_REPORT_TO }}
          # GitHub Issue（@ 维护者）
          GITHUB_ISSUE_ENABLED: "1"
          GITHUB_TOKEN: ${{ secrets.BOT_TOKEN }}
          GITHUB_ORG: "huaweicloud"
          MAINTAINER_RULES: ".github-repo/.github/configs/maintainer-rules.yml"
          UPGRADES_FILE: "upgrades.json"
        run: python .github/scripts/notify_upgrade.py
      - name: Create Audit Issue
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            const date = new Date();
            const title = `📊 月度治理巡检 — ${date.getFullYear()}-${String(date.getMonth()+1).padStart(2,'0')}`;
            console.log('Audit report ready:', title);
