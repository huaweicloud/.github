name: Monthly Governance Audit
on:
  schedule:
    - cron: '0 3 1 * *'  # 每月1日 CST 11:00
  workflow_dispatch:

permissions:
  issues: write
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Checkout .github org repo (for templates)
        uses: actions/checkout@v4
        with:
          repository: ${{ github.repository_owner }}/.github
          path: .github-repo
          ref: main
          token: ${{ secrets.BOT_TOKEN }}

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install requests

      - name: Run Governance Audit (KPI report)
        env:
          GITHUB_TOKEN: ${{ secrets.BOT_TOKEN }}
          GITHUB_ORG: "huaweicloud"
          AUDIT_OUTPUT: "output/audit_report.md"
        run: python .github/scripts/governance_audit.py

      - name: Run Governance Upgrade (auto-fill L2/L3 configs)
        if: false  # 暂不自动执行（避免批量改存量仓库）；手动启用时改为 true
        env:
          GITHUB_TOKEN: ${{ secrets.BOT_TOKEN }}
          GITHUB_ORG: "huaweicloud"
          TEMPLATE_DIR: ".github-repo"
        run: python .github/scripts/governance_upgrade.py

      - name: Notify Upgrades (Feishu/Email/GitHub Issue)
        if: false  # 随升级步骤一起禁用
        env:
          # 飞书（可选）
          FEISHU_APP_ID: ${{ secrets.FEISHU_APP_ID }}
          FEISHU_APP_SECRET: ${{ secrets.FEISHU_APP_SECRET }}
          FEISHU_ADMIN_OPEN_ID: ${{ secrets.FEISHU_ADMIN_OPEN_ID }}
          FEISHU_ENABLED: "1"
          # 邮件
          EMAIL_ENABLED: "1"
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          EMAIL_REPORT_TO: ${{ secrets.EMAIL_REPORT_TO }}
          # GitHub Issue（@ 维护者）
          GITHUB_ISSUE_ENABLED: "1"
          GITHUB_TOKEN: ${{ secrets.BOT_TOKEN }}
          GITHUB_ORG: "huaweicloud"
          MAINTAINER_RULES: ".github-repo/.github/configs/maintainer-rules.yml"
          UPGRADES_FILE: "upgrades.json"
        run: python .github/scripts/notify_upgrade.py
      - name: Create Audit Issue
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            const date = new Date();
            const title = `📊 月度治理巡检 — ${date.getFullYear()}-${String(date.getMonth()+1).padStart(2,'0')}`;
            console.log('Audit report ready:', title);
